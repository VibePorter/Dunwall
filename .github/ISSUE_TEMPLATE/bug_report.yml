name: Bug report
description: Something looks wrong, runs badly or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never attach game files, keys or anything made from the game (shaders, generated code, NROs).
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen
      options: [Switch (console), Ryujinx, PC build]
    validations: {required: true}
  - type: input
    id: console
    attributes:
      label: Console, firmware and clocks
      placeholder: "Switch OLED, firmware 19.0.1, Atmosphere 1.8.0, stock clocks"
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Handheld, Docked, Not applicable]
  - type: input
    id: build
    attributes:
      label: NRO sha256 (first 8 characters) and the settings you changed
      placeholder: "79e3f194, config/dishonored.toml with sa2_render_height_handheld = 360"
    validations: {required: true}
  - type: input
    id: language
    attributes:
      label: Game edition and language
      placeholder: "Eastern European disc, English (0.0.3.17)"
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and where in the game
      description: The mission or place, and the steps that lead to it.
    validations: {required: true}
  - type: textarea
    id: log
    attributes:
      label: Log
      description: dishonored.log from sdmc:/switch/dishonored/ (for a crash also deko3d.log and logs/rex/rex_crash.log; in Ryujinx its Logs/Ryujinx_*.log).
      render: text
