# 2026-11-09 (optimised-codegen audit): the CRT setjmp/longjmp pair, by shape (setjmp stores r13-r31, f14-f31 and
# v64-v127 into r3's buffer; longjmp loads them back). Callers: libpng 1.0.5 (png_create_* set the jump buffer,
# png_error longjmps on corrupt data). The generator turns calls to them into host setjmp/longjmp; without these a
# guest longjmp returned into the recompiled code after png_error.
setjmp_address = 0x82D88DD0
longjmp_address = 0x82D887B0

